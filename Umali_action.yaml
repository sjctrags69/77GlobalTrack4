name: Track 4 Print Metadata
run-name: This ${{ github.actor }} is starting out GitHub Actions
on:
- push
jobs:
   print-job:
      runs-on: windows-latest
      steps:
      -  name: Print messages in PowerShell
         run: |
            Write-Output "Hello from PowerShell!"
            Write-Host "This prints to console output as well."
            echo "echo works as an alias for Write-Output in PowerShell"
            
      -  name: Set up JDK 21 (Eclipse Temurin)
         uses: actions/setup-java@v4
         with:
            java-version: '21'
            distribution: temurin
            cache: maven 
            
      - name: Check Java version
        run: java -version
        
      - name: Build with Maven
        run: mvn --batch-mode clean package
            
      -  name: Checkout repository code
         uses: actions/checkout@v4
         
      -  name: Print OS runner type
         run: Write-Output "OS Runner Type - ${{ runner.os }}"
         
      -  name: Print event name
         run: Write-Output "Event Name - ${{ github.event_name }}"
         
      -  name: Print branch name
         run: Write-Output "Branch Name - ${{ github.ref_name }}"
         
      -  name: Print repository name
         run: Write-Output "Repository Name - ${{ github.repository }}"
         
      -  name: List files in workspace
         run: Get-ChildItem -Recurse