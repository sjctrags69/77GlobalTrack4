name: Track 4 Print Metadata
run-name: This ${{ github.actor }} is starting out GitHub Actions
on: [push]
jobs:
  print-job:
    runs-on: windows-latest
    steps:
      - name: Print messages in PowerShell
        run: |
          Write-Output "Hello from PowerShell!"
          Write-Host "This prints to console output as well."
          echo "echo works as an alias for Write-Output in PowerShell"

      - name: Print the OS runner type
        run: Write-Output "OS runner type - ${{ runner.os }}"

      - name: Print the event name that triggered the workflow
        run: Write-Output "Triggering event - ${{ github.event_name }}"

      - name: Print the name of the branch
        run: Write-Output "Branch name - ${{ github.ref_name }}"

      - name: Print the name of the GitHub repository
        run: Write-Output "Repository name - ${{ github.repository }}"

      - name: Check out the repository files
        uses: actions/checkout@v6

      - name: List all the files in the GitHub workspace
        run: Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Force | Select-Object -ExpandProperty FullName
